<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BOTTEGA 비밀번호 재설정</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      min-height: 100%;
      background: #f4f4f4;
      color: #111;
      font-family: Arial, "Noto Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .wrap {
      width: 100%;
      max-width: 430px;
    }

    .brand {
      text-align: center;
      margin-bottom: 22px;
    }

    .brand h1 {
      margin: 0;
      font-size: 32px;
      letter-spacing: 7px;
      font-weight: 700;
    }

    .brand p {
      margin: 8px 0 0;
      color: #777;
      font-size: 11px;
      letter-spacing: 3px;
    }

    .card {
      background: #fff;
      border: 1px solid #e4e4e4;
      border-radius: 16px;
      padding: 28px;
      box-shadow: 0 12px 35px rgba(0,0,0,.08);
    }

    .card h2 {
      margin: 0 0 7px;
      font-size: 21px;
    }

    .description {
      margin: 0 0 24px;
      color: #777;
      font-size: 13px;
      line-height: 1.6;
    }

    .field {
      margin-bottom: 15px;
    }

    .field label {
      display: block;
      margin-bottom: 7px;
      font-size: 13px;
      font-weight: 700;
    }

    .field input {
      width: 100%;
      height: 48px;
      border: 1px solid #ccc;
      border-radius: 9px;
      padding: 0 13px;
      font: inherit;
      outline: none;
    }

    .field input:focus {
      border-color: #111;
      box-shadow: 0 0 0 2px rgba(0,0,0,.05);
    }

    .save-button {
      width: 100%;
      height: 49px;
      border: 0;
      border-radius: 9px;
      background: #111;
      color: #fff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px;
    }

    .save-button:disabled {
      opacity: .5;
      cursor: not-allowed;
    }

    .message {
      display: none;
      margin-top: 14px;
      padding: 11px 12px;
      border-radius: 8px;
      font-size: 12px;
      line-height: 1.5;
    }

    .message.show {
      display: block;
    }

    .message.error {
      background: #fff0f0;
      color: #9b3131;
      border: 1px solid #efcccc;
    }

    .message.success {
      background: #eef8f1;
      color: #24753d;
      border: 1px solid #cde7d3;
    }

    .back-link {
      display: block;
      margin-top: 16px;
      text-align: center;
      color: #555;
      font-size: 12px;
      text-decoration: none;
    }

    .footer-note {
      text-align: center;
      margin-top: 16px;
      color: #999;
      font-size: 11px;
      line-height: 1.6;
    }
  </style>
</head>

<body>

  <div class="wrap">

    <div class="brand">
      <h1>BOTTEGA</h1>
      <p>ADMINISTRATION</p>
    </div>

    <div class="card">

      <h2>비밀번호 재설정</h2>

      <p class="description">
        새 비밀번호를 입력해주세요.
      </p>

      <form id="reset-form">

        <div class="field">
          <label for="new-password">새 비밀번호</label>
          <input
            id="new-password"
            type="password"
            autocomplete="new-password"
            placeholder="새 비밀번호"
            minlength="8"
            required
          >
        </div>

        <div class="field">
          <label for="confirm-password">새 비밀번호 확인</label>
          <input
            id="confirm-password"
            type="password"
            autocomplete="new-password"
            placeholder="새 비밀번호 다시 입력"
            minlength="8"
            required
          >
        </div>

        <button
          id="save-button"
          class="save-button"
          type="submit"
        >
          비밀번호 변경
        </button>

        <div
          id="message"
          class="message"
        ></div>

      </form>

      <a
        class="back-link"
        href="https://a01082942388a-oss.github.io/bottega-room-service/login.html"
      >
        로그인 화면으로 돌아가기
      </a>

    </div>

    <div class="footer-note">
      BOTTEGA ROOM SERVICE · ADMIN
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script>
    const SUPABASE_URL = 'https://yookspgooyewhnkobckw.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_uI5l3LBZPrZfuXJDLXMEqg_zFS3cbLp';

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY,
        {
          auth: {
            persistSession: true,
            autoRefreshToken: true,
            detectSessionInUrl: true
          }
        }
      );

    const form =
      document.getElementById('reset-form');

    const button =
      document.getElementById('save-button');

    const message =
      document.getElementById('message');

    function showMessage(text, type = 'error') {
      message.textContent = text;
      message.className = `message show ${type}`;
    }

    async function ensureRecoverySession() {
      const {
        data,
        error
      } =
        await supabaseClient.auth.getSession();

      if (
        error ||
        !data?.session
      ) {
        showMessage(
          '비밀번호 재설정 링크가 만료되었거나 유효하지 않습니다. 재설정 메일을 다시 요청해주세요.'
        );
      }
    }

    form.addEventListener(
      'submit',
      async event => {

        event.preventDefault();

        const password =
          document
            .getElementById('new-password')
            .value;

        const confirmPassword =
          document
            .getElementById('confirm-password')
            .value;

        if (
          password.length < 8
        ) {
          showMessage(
            '비밀번호는 8자 이상으로 설정해주세요.'
          );
          return;
        }

        if (
          password !==
          confirmPassword
        ) {
          showMessage(
            '비밀번호가 서로 일치하지 않습니다.'
          );
          return;
        }

        button.disabled = true;
        button.textContent = '변경 중...';

        const {
          data,
          error
        } =
          await supabaseClient.auth.updateUser({
            password
          });

        if (error) {
          button.disabled = false;
          button.textContent = '비밀번호 변경';

          showMessage(
            error.message ||
            '비밀번호 변경에 실패했습니다.'
          );
          return;
        }

        showMessage(
          '비밀번호가 변경되었습니다. 로그인 화면으로 이동합니다.',
          'success'
        );

        await supabaseClient.auth.signOut();

        setTimeout(
          () => {
            window.location.replace('https://a01082942388a-oss.github.io/bottega-room-service/login.html');
          },
          1400
        );
      }
    );

    ensureRecoverySession();
  </script>

</body>
</html>
