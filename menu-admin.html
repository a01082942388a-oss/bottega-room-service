<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BOTTEGA 메뉴관리</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#f4f4f4;color:#222;font-family:Arial,"Noto Sans KR",sans-serif}
button,input,select,textarea{font:inherit}
.admin-layout{min-height:100vh}
.sidebar{position:fixed;inset:0 auto 0 0;width:220px;background:#161616;color:#fff;padding:28px 14px;z-index:100}
.sidebar-logo{padding:0 12px 26px;border-bottom:1px solid #333;margin-bottom:20px}
.sidebar-logo h1{margin:0;font-size:21px;letter-spacing:3px}
.sidebar-logo p{margin:7px 0 0;color:#888;font-size:10px;letter-spacing:2px}
.sidebar-section-title{padding:0 12px;margin:18px 0 8px;color:#666;font-size:10px;font-weight:bold;letter-spacing:1.5px}
.sidebar-menu{display:flex;flex-direction:column;gap:5px}
.sidebar-item{width:100%;border:0;background:transparent;color:#aaa;padding:12px 14px;border-radius:8px;text-align:left;font-size:14px;font-weight:bold;cursor:pointer;display:flex;align-items:center;gap:9px}
.sidebar-item:hover{background:#242424;color:#fff}.sidebar-item.active{background:#fff;color:#111}
.sidebar-dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}.sidebar-coming{margin-left:auto;font-size:9px;font-weight:normal;color:#777}
.sub-menu{margin:3px 0 6px 26px;display:flex;flex-direction:column;gap:3px}
.sub-menu button{border:0;background:transparent;text-align:left;color:#777;padding:8px 10px;border-radius:7px;cursor:pointer;font-size:12px}
.sub-menu button:hover,.sub-menu button.active{background:#292929;color:#fff}
.main-area{margin-left:220px;min-width:0}
header{background:#111;color:#fff;padding:28px 25px}header h1{margin:0;font-size:23px;letter-spacing:1px}header p{margin:7px 0 0;color:#aaa;font-size:11px;letter-spacing:1.5px}
.container{max-width:1160px;margin:20px auto 80px;padding:0 18px}
.summary{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:15px}
.summary-box,.tool-box,.new-menu-box,.order-box{background:#fff;border-radius:12px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
.summary-box{padding:16px;text-align:center}.summary-number{display:block;font-size:24px;font-weight:bold}.summary-label{display:block;color:#777;font-size:12px;margin-top:5px}
.tool-box{padding:16px;margin-bottom:15px}.tool-row{display:flex;gap:10px;flex-wrap:wrap}
.search-input{flex:1;min-width:220px}.search-input,.category-select,.form-group input,.form-group textarea{border:1px solid #ddd;border-radius:9px;padding:12px;background:#fff}
.category-select{min-width:170px}.refresh-button,.add-menu-button,.save-order-button{border:0;color:#fff;padding:12px 18px;border-radius:9px;font-weight:bold;cursor:pointer}
.refresh-button{background:#111}.add-menu-button{background:#24753d}.save-order-button{background:#111}
.new-menu-box{display:none;padding:18px;margin-bottom:15px;border:2px solid #dcecdf}.new-menu-box.show{display:block}.new-menu-title{font-size:18px;font-weight:bold;margin-bottom:15px}
.form-grid{display:grid;grid-template-columns:1fr 180px 180px;gap:12px}.form-group{margin-bottom:13px}.form-group.full{grid-column:1/-1}.form-group label{display:block;font-size:12px;font-weight:bold;margin-bottom:6px;color:#555}.form-group input,.form-group textarea{width:100%}.form-group textarea{resize:vertical;min-height:75px}
.menu-card{background:#fff;border-radius:12px;padding:18px;margin-bottom:12px;box-shadow:0 2px 10px rgba(0,0,0,.05);border:2px solid transparent}.menu-card.soldout{border-color:#f0c36a}.menu-card.hidden-menu{opacity:.65;border-color:#bbb}
.menu-top{display:flex;justify-content:space-between;gap:15px;align-items:flex-start;padding-bottom:14px;border-bottom:1px solid #eee;margin-bottom:15px}.menu-title{font-size:18px;font-weight:bold}.menu-id{font-size:11px;color:#999;margin-top:5px}.status-wrap{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.status-badge{padding:7px 11px;border-radius:20px;font-size:12px;font-weight:bold;white-space:nowrap}.available{background:#e8f7ed;color:#24753d}.unavailable{background:#fff1d6;color:#8a5900}.hidden-badge{background:#eee;color:#555}
.translation-toggle{width:100%;margin-top:13px;padding:11px;border:1px solid #ddd;background:#fafafa;border-radius:8px;cursor:pointer;font-weight:bold;font-size:13px}.translation-area{display:none;margin-top:13px;padding:15px;background:#f8f8f8;border-radius:9px}.translation-area.show{display:block}.language-title{margin:15px 0 9px;font-size:13px;font-weight:bold}.language-title:first-child{margin-top:0}
.button-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:12px}.button-grid-3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:8px}.action-button{border:0;border-radius:9px;padding:12px;font-size:13px;font-weight:bold;cursor:pointer}.save-button{background:#111;color:#fff}.hide-button{background:#eee;color:#333}.delete-button{background:#fff0f0;color:#a33}.soldout-button{background:#fff4da;color:#805500}.resume-button{background:#e8f7ed;color:#24753d}
.empty{background:#fff;padding:60px 20px;text-align:center;border-radius:12px;color:#777}.saving{position:fixed;left:calc(50% + 110px);bottom:20px;transform:translateX(-50%);background:#111;color:#fff;padding:12px 18px;border-radius:30px;font-size:13px;display:none;z-index:999;box-shadow:0 5px 20px rgba(0,0,0,.25)}.saving.show{display:block}
.view{display:none}.view.active{display:block}
.order-box{padding:18px}.order-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px;margin-bottom:15px}.order-head h2{margin:0 0 5px;font-size:18px}.order-head p{margin:0;color:#888;font-size:12px;line-height:1.5}
.order-tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.order-tab{border:1px solid #ddd;background:#fff;border-radius:22px;padding:9px 15px;font-size:12px;font-weight:bold;cursor:pointer}.order-tab.active{background:#111;color:#fff;border-color:#111}
.order-list{display:flex;flex-direction:column;gap:8px}.order-row{display:flex;align-items:center;gap:12px;padding:12px;border:1px solid #e5e5e5;background:#fafafa;border-radius:10px;user-select:none}.drag-handle{width:38px;height:38px;border:1px solid #ddd;border-radius:8px;background:#fff;display:flex;align-items:center;justify-content:center;font-size:22px;color:#777;cursor:grab;flex:none}.order-row.dragging{opacity:.4}.order-row.drag-over{border-color:#111}.order-info{min-width:0;flex:1}.order-name{font-weight:bold;font-size:14px}.order-meta{margin-top:4px;font-size:11px;color:#999}.order-status{padding:6px 10px;border-radius:18px;font-size:11px;font-weight:bold}.order-row.hidden-row{opacity:.58}
.order-actions{display:none;margin-top:10px;padding:12px;background:#fff;border:1px solid #ddd;border-radius:10px}.order-actions.show{display:block}.order-actions-title{font-size:12px;color:#777;margin-bottom:9px}.order-actions-buttons{display:flex;gap:7px;flex-wrap:wrap}.mini-btn{border:0;border-radius:8px;padding:9px 12px;font-size:12px;font-weight:bold;cursor:pointer}
.help{margin:0 0 14px;padding:11px 13px;background:#f7f7f7;border-radius:9px;color:#666;font-size:12px;line-height:1.55}
@media(max-width:800px){.sidebar{position:relative;width:100%;padding:15px}.sidebar-menu{flex-direction:row;overflow:auto}.sidebar-item{width:auto;white-space:nowrap}.sidebar-section-title,.sub-menu{display:none}.main-area{margin-left:0}.summary{grid-template-columns:repeat(2,1fr)}.form-grid{grid-template-columns:1fr}.form-group.full{grid-column:auto}.saving{left:50%}.order-head{display:block}.save-order-button{margin-top:12px;width:100%}}
</style>
</head>
<body>
<div class="admin-layout">
<aside class="sidebar">
  <div class="sidebar-logo"><h1>BOTTEGA</h1><p>ADMIN</p></div>
  <div class="sidebar-section-title">MANAGEMENT</div>
  <div class="sidebar-menu">
    <button class="sidebar-item" onclick="location.href='./admin.html?v=2'"><span class="sidebar-dot"></span>주문관리</button>
    <button class="sidebar-item active" id="menu-main-nav" onclick="showView('manage')"><span class="sidebar-dot"></span>메뉴관리</button>
    <div class="sub-menu">
      <button id="sub-manage" class="active" onclick="showView('manage')">메뉴 수정</button>
      <button id="sub-order" onclick="showView('order')">메뉴 순서 변경</button>
    </div>
    <button class="sidebar-item" onclick="alert('매출관리 기능은 다음 단계에서 추가합니다.')"><span class="sidebar-dot"></span>매출관리<span class="sidebar-coming">예정</span></button>
    <button class="sidebar-item" onclick="alert('운영설정 기능은 다음 단계에서 추가합니다.')"><span class="sidebar-dot"></span>운영설정<span class="sidebar-coming">예정</span></button>
  </div>
</aside>

<div class="main-area">
<header><h1 id="page-title">메뉴관리</h1><p id="page-subtitle">ROOM SERVICE · MENU MANAGEMENT</p></header>
<div class="container">

<section id="manage-view" class="view active">
  <div class="summary">
    <div class="summary-box"><span class="summary-number" id="total-count">0</span><span class="summary-label">전체 메뉴</span></div>
    <div class="summary-box"><span class="summary-number" id="available-count">0</span><span class="summary-label">판매 가능</span></div>
    <div class="summary-box"><span class="summary-number" id="soldout-count">0</span><span class="summary-label">품절</span></div>
    <div class="summary-box"><span class="summary-number" id="hidden-count">0</span><span class="summary-label">숨김</span></div>
  </div>
  <div class="tool-box"><div class="tool-row">
    <input type="text" id="search-input" class="search-input" placeholder="메뉴명 검색">
    <select id="category-filter" class="category-select"><option value="all">전체 카테고리</option></select>
    <button class="add-menu-button" onclick="toggleNewMenuBox()">+ 새 메뉴 추가</button>
    <button class="refresh-button" onclick="loadMenus()">새로고침</button>
  </div></div>

  <div class="new-menu-box" id="new-menu-box">
    <div class="new-menu-title">새 메뉴 추가</div>
    <div class="form-grid">
      <div class="form-group"><label>메뉴명</label><input id="new-name" type="text"></div>
      <div class="form-group"><label>가격</label><input id="new-price" type="number" min="0" step="100"></div>
      <div class="form-group"><label>카테고리</label><input id="new-category" type="text" placeholder="PASTA"></div>
      <div class="form-group full"><label>설명</label><textarea id="new-description"></textarea></div>
    </div>
    <div class="button-grid"><button class="action-button save-button" onclick="addNewMenu()">메뉴 추가</button><button class="action-button hide-button" onclick="toggleNewMenuBox()">취소</button></div>
  </div>
  <div id="menu-list"><div class="empty">메뉴를 불러오는 중입니다.</div></div>
</section>

<section id="order-view" class="view">
  <div class="order-box">
    <div class="order-head">
      <div><h2>메뉴 순서 관리</h2><p>왼쪽 아이콘을 잡고 메뉴를 원하는 위치로 옮긴 뒤 <b>순서 저장</b>을 눌러야 고객 주문페이지에 반영됩니다.</p></div>
      <button class="save-order-button" id="save-order-button" onclick="saveMenuOrder()">순서 저장</button>
    </div>
    <div class="help">메뉴를 <b>더블클릭</b>하면 숨김 / 숨김 해제, 품절 1일 · 3일 · 1주, 품절 해제 버튼이 열립니다. 순서 변경 중에는 Supabase에 바로 저장되지 않습니다.</div>
    <div class="order-tabs" id="order-tabs"></div>
    <div class="order-list" id="order-list"></div>
  </div>
</section>

</div>
</div>
</div>
<div class="saving" id="saving">저장 중...</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL='https://yookspgooyewhnkobckw.supabase.co';
const SUPABASE_KEY='sb_publishable_uI5l3LBZPrZfuXJDLXMEqg_zFS3cbLp';
const supabaseClient=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let allMenus=[],isSaving=false,orderDraft=[],orderCategory='all',draggedId=null;

function isTimedSoldOut(m){if(!m.sold_out_until)return false;const t=new Date(m.sold_out_until).getTime();return Number.isFinite(t)&&t>Date.now()}
function isMenuAvailable(m){if(m.is_hidden===true)return false;if(isTimedSoldOut(m))return false;return m.is_available!==false}
function sortedMenus(list=allMenus){return [...list].sort((a,b)=>(Number(a.sort_order||0)-Number(b.sort_order||0))||(Number(a.id)-Number(b.id)))}
function escapeHtml(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;')}
function escapeAttribute(v){return escapeHtml(v)}
function formatDateTime(v){if(!v)return '-';const d=new Date(v);return Number.isNaN(d.getTime())?'-':d.toLocaleString('ko-KR',{year:'numeric',month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function showSaving(t){const e=document.getElementById('saving');e.textContent=t;e.classList.add('show')}
function hideSaving(){document.getElementById('saving').classList.remove('show')}

function showView(view){
  document.getElementById('manage-view').classList.toggle('active',view==='manage');
  document.getElementById('order-view').classList.toggle('active',view==='order');
  document.getElementById('sub-manage').classList.toggle('active',view==='manage');
  document.getElementById('sub-order').classList.toggle('active',view==='order');
  document.getElementById('page-title').textContent=view==='order'?'메뉴 순서 변경':'메뉴관리';
  document.getElementById('page-subtitle').textContent=view==='order'?'ROOM SERVICE · MENU ORDER':'ROOM SERVICE · MENU MANAGEMENT';
  if(view==='order'){orderDraft=sortedMenus();buildOrderTabs();renderOrderList()}
}

async function clearExpiredSoldOut(){
  const ids=allMenus.filter(m=>m.sold_out_until&&new Date(m.sold_out_until).getTime()<=Date.now()).map(m=>Number(m.id));
  if(!ids.length)return;
  const {error}=await supabaseClient.from('menus').update({is_available:true,sold_out_until:null}).in('id',ids);
  if(error)console.error(error);
}

async function loadMenus(){
  const {data,error}=await supabaseClient.from('menus').select('*').order('sort_order',{ascending:true});
  if(error){console.error(error);document.getElementById('menu-list').innerHTML='<div class="empty">메뉴를 불러오지 못했습니다.</div>';return}
  allMenus=data||[];
  await clearExpiredSoldOut();
  const r=await supabaseClient.from('menus').select('*').order('sort_order',{ascending:true});
  if(!r.error)allMenus=r.data||[];
  updateSummary();buildCategoryFilter();applyFilters();
  orderDraft=sortedMenus();buildOrderTabs();renderOrderList();
}

function updateSummary(){
  document.getElementById('total-count').textContent=allMenus.length;
  document.getElementById('hidden-count').textContent=allMenus.filter(m=>m.is_hidden===true).length;
  document.getElementById('soldout-count').textContent=allMenus.filter(m=>m.is_hidden!==true&&!isMenuAvailable(m)).length;
  document.getElementById('available-count').textContent=allMenus.filter(isMenuAvailable).length;
}
function categories(){return [...new Set(allMenus.map(m=>m.category).filter(Boolean))]}
function buildCategoryFilter(){
  const s=document.getElementById('category-filter'),cur=s.value;
  s.innerHTML='<option value="all">전체 카테고리</option>'+categories().map(c=>`<option value="${escapeAttribute(c)}">${escapeHtml(c)}</option>`).join('');
  if(categories().includes(cur))s.value=cur;
}
function applyFilters(){
  const k=document.getElementById('search-input').value.trim().toLowerCase(),c=document.getElementById('category-filter').value;
  renderMenus(allMenus.filter(m=>(!k||String(m.name||'').toLowerCase().includes(k)||String(m.name_en||'').toLowerCase().includes(k))&&(c==='all'||m.category===c)));
}

function renderMenus(menus){
 const list=document.getElementById('menu-list');
 if(!menus.length){list.innerHTML='<div class="empty">해당 메뉴가 없습니다.</div>';return}
 list.innerHTML=menus.map(m=>{
  const id=Number(m.id),hidden=m.is_hidden===true,available=isMenuAvailable(m),timed=isTimedSoldOut(m);
  return `<div class="menu-card ${hidden?'hidden-menu':available?'':'soldout'}">
   <div class="menu-top"><div><div class="menu-title">${escapeHtml(m.name||'메뉴')}</div><div class="menu-id">ID ${id} · ${escapeHtml(m.category||'-')}</div></div>
   <div class="status-wrap">${hidden?'<span class="status-badge hidden-badge">숨김</span>':''}<span class="status-badge ${available?'available':'unavailable'}">${available?'판매중':'품절'}</span></div></div>
   ${timed?`<div class="help">품절 해제 예정 · ${formatDateTime(m.sold_out_until)}</div>`:''}
   <div class="form-grid">
    <div class="form-group"><label>메뉴명</label><input id="name-${id}" value="${escapeAttribute(m.name||'')}"></div>
    <div class="form-group"><label>가격</label><input id="price-${id}" type="number" min="0" step="100" value="${Number(m.price||0)}"></div>
    <div class="form-group"><label>카테고리</label><input id="category-${id}" value="${escapeAttribute(m.category||'')}"></div>
    <div class="form-group full"><label>설명</label><textarea id="description-${id}">${escapeHtml(m.description||'')}</textarea></div>
   </div>
   <button class="translation-toggle" onclick="toggleTranslations(${id})">번역 수정 펼치기</button>
   <div class="translation-area" id="translation-${id}">
    ${langFields(id,'English','en',m)}${langFields(id,'日本語','ja',m)}${langFields(id,'中文','zh',m)}
   </div>
   <div class="button-grid"><button class="action-button save-button" onclick="saveMenu(${id})">수정내용 저장</button><button class="action-button hide-button" onclick="toggleHidden(${id},${hidden?'false':'true'})">${hidden?'숨김 해제':'숨김'}</button></div>
   ${available?`<div class="button-grid-3"><button class="action-button soldout-button" onclick="setTimedSoldOut(${id},1)">품절 1일</button><button class="action-button soldout-button" onclick="setTimedSoldOut(${id},3)">품절 3일</button><button class="action-button soldout-button" onclick="setTimedSoldOut(${id},7)">품절 1주</button></div>`:`<div class="button-grid"><button class="action-button resume-button" onclick="clearSoldOut(${id})">품절 해제</button><button class="action-button delete-button" onclick="deleteMenu(${id})">메뉴 삭제</button></div>`}
   ${available?`<div class="button-grid"><button class="action-button delete-button" onclick="deleteMenu(${id})">메뉴 삭제</button></div>`:''}
  </div>`
 }).join('')
}
function langFields(id,title,code,m){return `<div class="language-title">${title}</div><div class="form-group"><label>메뉴명</label><input id="name-${code}-${id}" value="${escapeAttribute(m['name_'+code]||'')}"></div><div class="form-group"><label>설명</label><textarea id="description-${code}-${id}">${escapeHtml(m['description_'+code]||'')}</textarea></div>`}
function toggleTranslations(id){document.getElementById(`translation-${id}`).classList.toggle('show')}
function toggleNewMenuBox(){document.getElementById('new-menu-box').classList.toggle('show')}

async function addNewMenu(){
 if(isSaving)return;
 const name=document.getElementById('new-name').value.trim(),price=Number(document.getElementById('new-price').value),category=document.getElementById('new-category').value.trim(),description=document.getElementById('new-description').value.trim();
 if(!name)return alert('메뉴명을 입력해주세요.');if(!Number.isFinite(price)||price<0)return alert('가격을 확인해주세요.');
 const max=allMenus.reduce((n,m)=>Math.max(n,Number(m.sort_order||0)),0);
 isSaving=true;showSaving('메뉴 추가 중...');
 const {error}=await supabaseClient.from('menus').insert({name,price,category,description,sort_order:max+1,is_available:true,is_hidden:false,sold_out_until:null});
 isSaving=false;if(error){hideSaving();console.error(error);return alert('메뉴 추가에 실패했습니다.')}
 ['new-name','new-price','new-category','new-description'].forEach(id=>document.getElementById(id).value='');document.getElementById('new-menu-box').classList.remove('show');showSaving('메뉴 추가 완료');setTimeout(hideSaving,800);await loadMenus()
}

async function saveMenu(id){
 if(isSaving)return;
 const updateData={name:document.getElementById(`name-${id}`).value.trim(),price:Number(document.getElementById(`price-${id}`).value),category:document.getElementById(`category-${id}`).value.trim(),description:document.getElementById(`description-${id}`).value.trim(),name_en:document.getElementById(`name-en-${id}`).value.trim(),description_en:document.getElementById(`description-en-${id}`).value.trim(),name_ja:document.getElementById(`name-ja-${id}`).value.trim(),description_ja:document.getElementById(`description-ja-${id}`).value.trim(),name_zh:document.getElementById(`name-zh-${id}`).value.trim(),description_zh:document.getElementById(`description-zh-${id}`).value.trim()};
 if(!updateData.name)return alert('메뉴명을 입력해주세요.');if(!Number.isFinite(updateData.price)||updateData.price<0)return alert('가격을 확인해주세요.');
 isSaving=true;showSaving('저장 중...');const {error}=await supabaseClient.from('menus').update(updateData).eq('id',id);isSaving=false;
 if(error){hideSaving();console.error(error);return alert('메뉴 수정에 실패했습니다.')}showSaving('저장 완료');setTimeout(hideSaving,800);await loadMenus()
}
async function toggleHidden(id,newValue){
 if(!confirm(newValue?'이 메뉴를 고객 주문페이지에서 숨기시겠습니까?':'이 메뉴의 숨김을 해제하시겠습니까?'))return;
 const {error}=await supabaseClient.from('menus').update({is_hidden:newValue}).eq('id',id);if(error){console.error(error);return alert('숨김 상태 변경에 실패했습니다.')}await loadMenus()
}
async function setTimedSoldOut(id,days){
 const text=days===7?'1주일':days+'일';if(!confirm(`${text} 동안 품절 처리하시겠습니까?`))return;
 const until=new Date(Date.now()+days*86400000);const {error}=await supabaseClient.from('menus').update({is_available:false,sold_out_until:until.toISOString()}).eq('id',id);
 if(error){console.error(error);return alert('품절 처리에 실패했습니다.')}await loadMenus()
}
async function clearSoldOut(id){
 if(!confirm('이 메뉴의 품절을 해제하시겠습니까?'))return;
 const {error}=await supabaseClient.from('menus').update({is_available:true,sold_out_until:null}).eq('id',id);if(error){console.error(error);return alert('품절 해제에 실패했습니다.')}await loadMenus()
}
async function deleteMenu(id){
 if(!confirm('정말 이 메뉴를 삭제하시겠습니까?\\n삭제한 메뉴는 복구할 수 없습니다.'))return;if(!confirm('한 번 더 확인합니다.\\n정말 삭제하시겠습니까?'))return;
 const {error}=await supabaseClient.from('menus').delete().eq('id',id);if(error){console.error(error);return alert('메뉴 삭제에 실패했습니다.')}await loadMenus()
}

function buildOrderTabs(){
 const cats=categories();if(orderCategory!=='all'&&!cats.includes(orderCategory))orderCategory='all';
 document.getElementById('order-tabs').innerHTML=[['all','전체'],...cats.map(c=>[c,c])].map(([v,t])=>`<button class="order-tab ${orderCategory===v?'active':''}" onclick="setOrderCategory('${escapeJs(v)}')">${escapeHtml(t)}</button>`).join('')
}
function escapeJs(v){return String(v).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function setOrderCategory(c){orderCategory=c;buildOrderTabs();renderOrderList()}
function visibleOrderDraft(){return orderCategory==='all'?orderDraft:orderDraft.filter(m=>m.category===orderCategory)}
function renderOrderList(){
 const el=document.getElementById('order-list'),menus=visibleOrderDraft();
 if(!menus.length){el.innerHTML='<div class="empty">해당 카테고리에 메뉴가 없습니다.</div>';return}
 el.innerHTML=menus.map((m,i)=>{
  const hidden=m.is_hidden===true,avail=isMenuAvailable(m),id=Number(m.id);
  return `<div class="order-item" data-id="${id}">
   <div class="order-row ${hidden?'hidden-row':''}" draggable="true" data-id="${id}" ondblclick="toggleOrderActions(${id})" ondragstart="dragStart(event,${id})" ondragover="dragOver(event)" ondragleave="dragLeave(event)" ondrop="dropRow(event,${id})" ondragend="dragEnd(event)">
    <div class="drag-handle">☰</div><div class="order-info"><div class="order-name">${escapeHtml(m.name||'메뉴')}</div><div class="order-meta">${i+1}번째 · ${escapeHtml(m.category||'-')}</div></div>
    <span class="order-status ${hidden?'hidden-badge':avail?'available':'unavailable'}">${hidden?'숨김':avail?'판매중':'품절'}</span>
   </div>
   <div class="order-actions" id="order-actions-${id}"><div class="order-actions-title">${escapeHtml(m.name||'메뉴')} 상태 관리</div><div class="order-actions-buttons">
    <button class="mini-btn hide-button" onclick="toggleHidden(${id},${hidden?'false':'true'})">${hidden?'숨김 해제':'숨김'}</button>
    ${avail?`<button class="mini-btn soldout-button" onclick="setTimedSoldOut(${id},1)">품절 1일</button><button class="mini-btn soldout-button" onclick="setTimedSoldOut(${id},3)">품절 3일</button><button class="mini-btn soldout-button" onclick="setTimedSoldOut(${id},7)">품절 1주</button>`:`<button class="mini-btn resume-button" onclick="clearSoldOut(${id})">품절 해제</button>`}
   </div></div>
  </div>`
 }).join('')
}
function toggleOrderActions(id){document.getElementById(`order-actions-${id}`).classList.toggle('show')}
function dragStart(e,id){draggedId=id;e.currentTarget.classList.add('dragging');e.dataTransfer.effectAllowed='move'}
function dragOver(e){e.preventDefault();e.currentTarget.classList.add('drag-over');e.dataTransfer.dropEffect='move'}
function dragLeave(e){e.currentTarget.classList.remove('drag-over')}
function dragEnd(e){e.currentTarget.classList.remove('dragging');document.querySelectorAll('.drag-over').forEach(x=>x.classList.remove('drag-over'));draggedId=null}
function dropRow(e,targetId){
 e.preventDefault();e.currentTarget.classList.remove('drag-over');if(draggedId===null||draggedId===targetId)return;
 const source=orderDraft.find(m=>Number(m.id)===Number(draggedId)),target=orderDraft.find(m=>Number(m.id)===Number(targetId));if(!source||!target)return;
 if(orderCategory==='all'){
   const from=orderDraft.indexOf(source),to=orderDraft.indexOf(target);orderDraft.splice(from,1);orderDraft.splice(to,0,source);
 }else{
   const catItems=orderDraft.filter(m=>m.category===orderCategory),from=catItems.indexOf(source),to=catItems.indexOf(target);catItems.splice(from,1);catItems.splice(to,0,source);
   let p=0;orderDraft=orderDraft.map(m=>m.category===orderCategory?catItems[p++]:m);
 }
 renderOrderList()
}
async function saveMenuOrder(){
 if(isSaving)return;if(!confirm('현재 메뉴 순서를 저장하고 고객 주문페이지에 적용하시겠습니까?'))return;
 isSaving=true;showSaving('메뉴 순서 저장 중...');
 try{
   for(let i=0;i<orderDraft.length;i++){
     const {error}=await supabaseClient.from('menus').update({sort_order:i+1}).eq('id',Number(orderDraft[i].id));
     if(error)throw error;
   }
   showSaving('순서 저장 완료');setTimeout(hideSaving,900);isSaving=false;await loadMenus();showView('order')
 }catch(error){console.error('ORDER SAVE ERROR:',error);isSaving=false;hideSaving();alert('순서 저장에 실패했습니다. Supabase UPDATE 권한을 확인해주세요.')}
}

document.getElementById('search-input').addEventListener('input',applyFilters);
document.getElementById('category-filter').addEventListener('change',applyFilters);
loadMenus();
setInterval(loadMenus,60000);
</script>
